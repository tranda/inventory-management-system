openapi: 3.0.3
info:
  title: IT Inventory Management System API
  description: RESTful API for managing IT equipment inventory, assignments, and reporting
  version: 1.0.0
  contact:
    name: IT Department

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://inventory.company.com/api
    description: Production server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Items
    description: Inventory item management
  - name: Employees
    description: Employee management
  - name: Assignments
    description: Equipment assignment operations
  - name: Reports
    description: Reporting and analytics
  - name: Audit
    description: Audit log access

paths:
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only refresh token cookie
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: User logout
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== ITEMS ====================
  /items:
    get:
      tags: [Items]
      summary: List inventory items
      operationId: listItems
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: Search in name, serial, asset ID, brand, model
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ItemCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ItemStatus'
        - name: condition
          in: query
          schema:
            $ref: '#/components/schemas/ItemCondition'
        - name: location
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, assetId, createdAt, purchaseDate, warrantyExpiration]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Items]
      summary: Create new item
      operationId: createItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /items/{id}:
    get:
      tags: [Items]
      summary: Get item by ID
      operationId: getItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Items]
      summary: Update item
      operationId: updateItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Items]
      summary: Soft delete item (decommission)
      operationId: softDeleteItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Item decommissioned
        '400':
          description: Cannot delete assigned item
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{id}/permanent:
    delete:
      tags: [Items]
      summary: Permanently delete item (admin only)
      operationId: permanentDeleteItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Item permanently deleted
        '400':
          description: Cannot delete assigned item
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{id}/history:
    get:
      tags: [Items]
      summary: Get item assignment history
      operationId: getItemHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item history
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/ItemSummary'
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentHistory'
                  auditLog:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{id}/status:
    patch:
      tags: [Items]
      summary: Change item status manually
      operationId: changeItemStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  $ref: '#/components/schemas/ItemStatus'
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /items/bulk-delete:
    post:
      tags: [Items]
      summary: Bulk soft delete items
      operationId: bulkDeleteItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds, reason]
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        reason:
                          type: string

  /items/export:
    get:
      tags: [Items]
      summary: Export items to CSV/Excel
      operationId: exportItems
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ItemCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ItemStatus'
      responses:
        '200':
          description: File download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  # ==================== EMPLOYEES ====================
  /employees:
    get:
      tags: [Employees]
      summary: List employees
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
        - name: department
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [Employees]
      summary: Create employee
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get employee with current assignments
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Employee details with current equipment
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    $ref: '#/components/schemas/Employee'
                  currentAssignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentWithItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Employees]
      summary: Update employee
      operationId: updateEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{id}/history:
    get:
      tags: [Employees]
      summary: Get employee assignment history
      operationId: getEmployeeHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Employee assignment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    $ref: '#/components/schemas/Employee'
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentWithItem'

  # ==================== ASSIGNMENTS ====================
  /assignments:
    get:
      tags: [Assignments]
      summary: List assignments
      operationId: listAssignments
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter active (not returned) assignments
        - name: itemId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentDetail'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [Assignments]
      summary: Create assignment (assign item to employee)
      operationId: createAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetail'
        '400':
          description: Item not available or already assigned
        '403':
          $ref: '#/components/responses/Forbidden'

  /assignments/{id}/return:
    put:
      tags: [Assignments]
      summary: Process item return
      operationId: returnItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnItemRequest'
      responses:
        '200':
          description: Return processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetail'
        '400':
          description: Assignment already returned
        '403':
          $ref: '#/components/responses/Forbidden'

  /assignments/{id}/transfer:
    put:
      tags: [Assignments]
      summary: Transfer item to another employee
      operationId: transferItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferItemRequest'
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  previousAssignment:
                    $ref: '#/components/schemas/AssignmentDetail'
                  newAssignment:
                    $ref: '#/components/schemas/AssignmentDetail'
        '400':
          description: Assignment already returned
        '403':
          $ref: '#/components/responses/Forbidden'

  /assignments/{id}/acknowledge:
    post:
      tags: [Assignments]
      summary: Acknowledge assignment receipt
      operationId: acknowledgeAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Acknowledgment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetail'

  # ==================== REPORTS ====================
  /reports/inventory:
    get:
      tags: [Reports]
      summary: Inventory summary report
      operationId: getInventoryReport
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReport'

  /reports/assignments:
    get:
      tags: [Reports]
      summary: Assignment report with date range
      operationId: getAssignmentReport
      security:
        - bearerAuth: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Assignment report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentReport'

  /reports/employee/{id}:
    get:
      tags: [Reports]
      summary: Employee equipment report
      operationId: getEmployeeReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Employee equipment report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeReport'

  /reports/warranty:
    get:
      tags: [Reports]
      summary: Warranty status report
      operationId: getWarrantyReport
      security:
        - bearerAuth: []
      parameters:
        - name: expiringSoon
          in: query
          schema:
            type: boolean
          description: Filter items with warranty expiring in 30 days
      responses:
        '200':
          description: Warranty report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyReport'

  /reports/depreciation:
    get:
      tags: [Reports]
      summary: Depreciation tracking report
      operationId: getDepreciationReport
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Depreciation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepreciationReport'

  # ==================== DASHBOARD ====================
  /dashboard:
    get:
      tags: [Reports]
      summary: Dashboard data
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

  # ==================== AUDIT ====================
  /audit-log:
    get:
      tags: [Audit]
      summary: Get audit log entries
      operationId: getAuditLog
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: entityType
          in: query
          schema:
            type: string
            enum: [Item, Assignment, Employee, User]
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ========== ENUMS ==========
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, VIEWER]

    ItemCategory:
      type: string
      enum: [LAPTOP, MONITOR, KEYBOARD, MOUSE, HEADSET, PHONE, TABLET, CABLES, SOFTWARE_LICENSE, OTHER]

    ItemStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, RESERVED, IN_REPAIR, DECOMMISSIONED, LOST_STOLEN]

    ItemCondition:
      type: string
      enum: [NEW, GOOD, FAIR, NEEDS_REPAIR, DECOMMISSIONED]

    # ========== USER ==========
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ========== ITEM ==========
    ItemSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/ItemCategory'
        status:
          $ref: '#/components/schemas/ItemStatus'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        brand:
          type: string
        model:
          type: string
        thumbnailUrl:
          type: string
        currentAssignee:
          type: string
          description: Employee name if assigned

    Item:
      allOf:
        - $ref: '#/components/schemas/ItemSummary'
        - type: object
          properties:
            serialNumber:
              type: string
            purchaseDate:
              type: string
              format: date
            purchasePrice:
              type: number
            warrantyExpiration:
              type: string
              format: date
            location:
              type: string
            notes:
              type: string
            photoUrl:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string
              description: User name

    CreateItemRequest:
      type: object
      required: [name, category, serialNumber]
      properties:
        assetId:
          type: string
          description: Auto-generated if not provided
        name:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/ItemCategory'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
          maxLength: 100
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
          minimum: 0
        warrantyExpiration:
          type: string
          format: date
        location:
          type: string
        notes:
          type: string
        photo:
          type: string
          format: binary

    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
        category:
          $ref: '#/components/schemas/ItemCategory'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        purchaseDate:
          type: string
          format: date
        purchasePrice:
          type: number
        warrantyExpiration:
          type: string
          format: date
        location:
          type: string
        notes:
          type: string
        photo:
          type: string
          format: binary

    # ========== EMPLOYEE ==========
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        title:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        assignmentCount:
          type: integer
          description: Number of currently assigned items

    CreateEmployeeRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        title:
          type: string
        phone:
          type: string

    UpdateEmployeeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        title:
          type: string
        phone:
          type: string
        isActive:
          type: boolean

    # ========== ASSIGNMENT ==========
    AssignmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          $ref: '#/components/schemas/ItemSummary'
        employee:
          $ref: '#/components/schemas/Employee'
        assignedBy:
          type: string
          description: User name
        assignedAt:
          type: string
          format: date-time
        expectedReturnAt:
          type: string
          format: date-time
        purpose:
          type: string
        conditionAtAssignment:
          $ref: '#/components/schemas/ItemCondition'
        acknowledged:
          type: boolean
        acknowledgedAt:
          type: string
          format: date-time
        notes:
          type: string
        returnedAt:
          type: string
          format: date-time
        returnedBy:
          type: string
          description: User name
        conditionAtReturn:
          $ref: '#/components/schemas/ItemCondition'
        returnNotes:
          type: string

    AssignmentWithItem:
      type: object
      properties:
        assignment:
          $ref: '#/components/schemas/AssignmentDetail'
        item:
          $ref: '#/components/schemas/ItemSummary'

    AssignmentHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeName:
          type: string
        assignedAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
        duration:
          type: string
          description: Human readable duration
        conditionAtAssignment:
          $ref: '#/components/schemas/ItemCondition'
        conditionAtReturn:
          $ref: '#/components/schemas/ItemCondition'

    CreateAssignmentRequest:
      type: object
      required: [itemId, employeeId, conditionAtAssignment]
      properties:
        itemId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
          description: Defaults to now
        expectedReturnAt:
          type: string
          format: date-time
        purpose:
          type: string
        conditionAtAssignment:
          $ref: '#/components/schemas/ItemCondition'
        notes:
          type: string

    ReturnItemRequest:
      type: object
      required: [conditionAtReturn]
      properties:
        returnedAt:
          type: string
          format: date-time
          description: Defaults to now
        conditionAtReturn:
          $ref: '#/components/schemas/ItemCondition'
        returnNotes:
          type: string

    TransferItemRequest:
      type: object
      required: [toEmployeeId, reason]
      properties:
        toEmployeeId:
          type: string
          format: uuid
        reason:
          type: string
        transferredAt:
          type: string
          format: date-time
          description: Defaults to now

    # ========== REPORTS ==========
    Dashboard:
      type: object
      properties:
        totalItems:
          type: integer
        byCategory:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/ItemCategory'
              count:
                type: integer
        byStatus:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/ItemStatus'
              count:
                type: integer
        dueSoon:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentDetail'
        expiredWarranties:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    InventoryReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        totalItems:
          type: integer
        totalValue:
          type: number
        byCategory:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/ItemCategory'
              count:
                type: integer
              value:
                type: number
        byStatus:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/ItemStatus'
              count:
                type: integer
        byCondition:
          type: array
          items:
            type: object
            properties:
              condition:
                $ref: '#/components/schemas/ItemCondition'
              count:
                type: integer

    AssignmentReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        dateRange:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        totalAssignments:
          type: integer
        totalReturns:
          type: integer
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentDetail'

    EmployeeReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        employee:
          $ref: '#/components/schemas/Employee'
        currentAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        totalValueAssigned:
          type: number
        assignmentHistory:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentHistory'

    WarrantyReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        expiringSoon:
          type: array
          items:
            type: object
            properties:
              item:
                $ref: '#/components/schemas/ItemSummary'
              warrantyExpiration:
                type: string
                format: date
              daysRemaining:
                type: integer
        expired:
          type: array
          items:
            type: object
            properties:
              item:
                $ref: '#/components/schemas/ItemSummary'
              warrantyExpiration:
                type: string
                format: date

    DepreciationReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              item:
                $ref: '#/components/schemas/ItemSummary'
              purchasePrice:
                type: number
              purchaseDate:
                type: string
                format: date
              ageInMonths:
                type: integer
              currentValue:
                type: number
              depreciationRate:
                type: number
                description: Annual depreciation rate used

    # ========== AUDIT ==========
    # Constitution Art. 5.4 requires: who, what, when, before/after, IP, user agent
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        action:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
          description: User name for display
        before:
          type: object
          nullable: true
          description: Entity state before change (null for CREATE)
        after:
          type: object
          nullable: true
          description: Entity state after change (null for DELETE)
        metadata:
          type: object
          properties:
            ipAddress:
              type: string
              description: Client IP address (Constitution Art. 5.4)
            userAgent:
              type: string
              description: Client user agent (Constitution Art. 5.4)
        createdAt:
          type: string
          format: date-time

    # ========== COMMON ==========
    # Constitution Art. 4.2 mandates this response format
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
          description: Response payload (present on success)
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      properties:
        total:
          type: integer
          description: Total count of items matching query
        page:
          type: integer
          description: Current page (if using offset pagination)
        limit:
          type: integer
          description: Items per page
        cursor:
          type: string
          nullable: true
          description: Next page cursor (if using cursor pagination)
        hasMore:
          type: boolean
          description: Whether more results exist

    Pagination:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        total:
          type: integer

    # Constitution Art. 4.2 mandates this error format
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g., VALIDATION_ERROR)
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
